<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard NPS - Vegas Vigilância</title>

  <!-- Tema claro/escuro: aplicado antes de desenhar a página -->
  <script>
    (function () {
      try { if (localStorage.getItem('vegas_tema') === 'claro') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #04070d;
      --panel: rgba(8, 13, 22, .86);
      --panel-2: rgba(16, 24, 38, .9);
      --field: rgba(12, 19, 32, .92);
      --line: rgba(150, 175, 210, .22);
      --line-strong: rgba(170, 195, 230, .38);
      --text: #f2f5fa;
      --subtext: #b9c4d4;
      --dim: #8796ab;
      --accent: #ffd21f;          /* amarelo das notas */
      --blue: #2f8cff;
      --glow: rgba(60, 140, 255, .14);
      --shadow: 0 18px 44px rgba(0, 0, 0, .55);
      --font: 'Montserrat', 'Segoe UI', system-ui, Roboto, Arial, sans-serif;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #eef2f8;
      --panel: rgba(255, 255, 255, .9);
      --panel-2: #ffffff;
      --field: #ffffff;
      --line: rgba(30, 60, 110, .16);
      --line-strong: rgba(30, 80, 160, .32);
      --text: #0d1a30;
      --subtext: #3d4e68;
      --dim: #66778f;
      --accent: #b7860b;
      --blue: #1f78f0;
      --glow: rgba(40, 110, 220, .12);
      --shadow: 0 18px 40px rgba(20, 45, 90, .14);
      color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Fundo: central de monitoramento */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -2;
      background: url('./assets/bg-nps.jpg') left center / cover no-repeat, var(--bg);
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(180deg, rgba(3, 6, 12, 0) 60%, rgba(3, 6, 12, .55) 100%);
    }
    [data-theme="light"] body::after {
      background: linear-gradient(90deg, rgba(238, 242, 248, .55) 0%, rgba(238, 242, 248, .82) 35%, rgba(238, 242, 248, .9) 100%);
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* ---------- Cabeçalho ---------- */
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 32px;
      padding: clamp(24px, 3.6vw, 64px) 10vw clamp(20px, 2.4vw, 40px) 22vw;
    }
    .marca { display: flex; align-items: center; gap: clamp(10px, 1.2vw, 20px); }
    .marca .emblema { width: clamp(84px, 7.4vw, 136px); height: auto; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .6)); }
    .marca .wordmark { display: block; width: clamp(200px, 22vw, 400px); height: auto; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .55)); }
    .marca .sub {
      display: block; margin-top: .45em; font-weight: 700; color: #e9eef6;
      font-size: clamp(12px, 1.3vw, 23px); letter-spacing: .1em; text-align: right;
    }
    .slogan { line-height: .98; text-transform: uppercase; }
    .slogan .fino {
      display: block; font-weight: 300; letter-spacing: .02em; color: #cfd8e4;
      font-size: clamp(22px, 2.9vw, 52px);
    }
    .slogan .forte {
      display: block; font-weight: 800; font-size: clamp(26px, 3.3vw, 60px);
      background: linear-gradient(180deg, #ffffff 0%, #c9d1dc 45%, #8e98a6 55%, #e3e8ef 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .55));
    }
    .header-beam {
      height: 2px; margin: 0 10vw 0 34.5vw;
      background: linear-gradient(90deg, transparent, rgba(80, 160, 255, .9) 30%, rgba(140, 200, 255, .9) 55%, transparent);
      box-shadow: 0 0 12px rgba(60, 150, 255, .8);
    }

    [data-theme="light"] .marca .wordmark { filter: brightness(.6) contrast(1.35); }
    [data-theme="light"] .marca .sub { color: #1d2b44; }
    [data-theme="light"] .slogan .fino { color: #3a4a64; }
    [data-theme="light"] .slogan .forte {
      background: linear-gradient(180deg, #2a3a55 0%, #4d5d78 50%, #1b2840 100%);
      -webkit-background-clip: text; background-clip: text; filter: none;
    }

    /* ---------- Conteúdo ---------- */
    .container { margin: 22px 9.5vw 0 34.5vw; }

    .painel {
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 22px 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow), 0 0 26px var(--glow), inset 0 1px 0 rgba(255, 255, 255, .05);
    }

    .grafico h2 { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    .grafico { padding: 18px 18px 16px; }
    .grafico-area { position: relative; max-width: 290px; margin: 0 auto; }

    /* Filtros */
    .top-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 10px 12px; margin-bottom: 14px;
    }
    .top-bar input,
    .top-bar select {
      padding: 9px 12px; font-size: 13px; font-family: inherit;
      border-radius: 6px; border: 1px solid var(--line-strong);
      background: var(--field); color: var(--text);
    }
    .top-bar select { padding-right: 30px; cursor: pointer; }
    .top-bar input:focus, .top-bar select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47, 140, 255, .2); }
    .busca { position: relative; }
    .busca svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--subtext); pointer-events: none; }
    .busca input { padding-left: 34px; width: 150px; }
    .periodo input { width: 132px; }
    .periodo { display: flex; gap: 8px; align-items: center; }
    .periodo label { font-size: 13px; font-weight: 600; }
    .quebra { flex-basis: 100%; height: 0; }   /* força a 2ª linha (Produtos / Atendentes) */

    .nps-box {
      display: flex; align-items: center; gap: 14px;
      background: var(--panel-2);
      border: 1px solid var(--line-strong);
      padding: 11px 16px; border-radius: 6px;
      font-weight: 700; font-size: 17px; color: var(--accent);
      margin-bottom: 16px;
    }
    .nps-box svg { width: 22px; height: 22px; flex: 0 0 22px; color: var(--subtext); }

    /* Cards de comentário */
    .comentarios-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card-comentario {
      background: var(--panel-2);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 14px 16px;
      display: flex; flex-direction: column;
      transition: transform .2s ease, border-color .2s ease;
    }
    .card-comentario:hover { transform: translateY(-2px); border-color: rgba(90, 160, 255, .6); }

    .nota { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; color: var(--accent); }
    .nota svg { width: 19px; height: 19px; }
    .nome { font-size: 15px; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
    .data-card { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--subtext); margin: 4px 0 10px; }
    .data-card svg { width: 13px; height: 13px; }
    .comentario { font-style: italic; color: var(--text); opacity: .92; margin-bottom: 10px; }
    .extras { font-size: 13px; color: var(--subtext); margin-top: auto; }

    /* Rodapé */
    footer {
      margin: 26px 9.5vw 0 34.5vw; padding: 18px 0 28px;
      text-align: center; font-size: 12px; letter-spacing: .08em; color: #c7d1df;
      border-top: 1px solid var(--line);
    }
    [data-theme="light"] footer { color: var(--subtext); }

    /* Botão de tema */
    .tema-fab {
      position: fixed; top: 16px; right: 16px; z-index: 60; width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer;
      background: var(--panel); color: var(--text); border: 1px solid var(--line-strong);
      box-shadow: 0 0 16px var(--glow);
    }
    .tema-fab:hover { color: var(--blue); }
    .tema-fab svg { width: 20px; height: 20px; }

    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    /* ---------- Responsivo ---------- */
    @media (max-width: 1100px) {
      body::after { background: rgba(3, 6, 12, .72); }
      [data-theme="light"] body::after { background: rgba(238, 242, 248, .88); }
      header { flex-direction: column; text-align: center; padding: 28px 20px 18px; gap: 18px; }
      .marca .sub { text-align: center; }
      .header-beam { margin: 0 20px; }
      .container, footer { margin-left: 20px; margin-right: 20px; }
      .slogan .fino { font-size: 26px; }
      .slogan .forte { font-size: 30px; }
    }
    @media (max-width: 1400px) and (min-width: 1101px) {
      .container, footer { margin-left: 32.5vw; margin-right: 5vw; }
      .header-beam { margin-right: 5vw; margin-left: 32.5vw; }
      header { padding-right: 6vw; }
      .busca input { width: 120px; }
      .periodo input { width: 120px; padding: 9px 6px; }
    }
    @media (max-width: 600px) {
      .top-bar { flex-direction: column; align-items: stretch; }
      .busca input { width: 100%; }
      .periodo { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; }
      .periodo input { width: 100%; min-width: 0; }
      .quebra { display: none; }
      .nps-box { font-size: 14px; }
      .marca .wordmark { width: 190px; }
      .marca .emblema { width: 72px; }
      .slogan .fino { font-size: 20px; }
      .slogan .forte { font-size: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>

<body>

  <header>
    <div class="marca">
      <img class="emblema" src="./assets/emblema-vegas.png" alt="Vegas Vigilância e Segurança">
      <div>
        <img class="wordmark" src="./assets/wordmark-vegas.png" alt="VEGAS">
        <span class="sub">VIGILÂNCIA E SEGURANÇA</span>
      </div>
    </div>
    <div class="slogan" aria-hidden="true">
      <span class="fino">Sua segurança</span>
      <span class="forte">É o nosso<br>compromisso</span>
    </div>
  </header>
  <div class="header-beam"></div>
  <h1 class="sr-only">Dashboard - Comentários e Notas NPS</h1>

  <div class="container">

    <div class="painel grafico">
      <h2>Distribuição das Notas</h2>
      <div class="grafico-area"><canvas id="graficoPizza"></canvas></div>
    </div>

    <div class="painel comentarios-section">
      <div class="top-bar">

        <select id="filtroCidade">
          <option value="Respostas">NPS Volta Redonda</option>
          <option value="Respostas Niteroi">NPS Niterói</option>
          <option value="Respostas Funcionários">NPS Funcionários</option>
        </select>

        <div class="busca">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 20.5c0-4.1 3.6-6.8 8-6.8s8 2.7 8 6.8z"/></svg>
          <input type="text" id="buscaNome" placeholder="Nome..." aria-label="Buscar por nome">
        </div>

        <div class="periodo">
          <label for="dataInicio">De:</label>
          <input type="date" id="dataInicio">
          <label for="dataFim">Até:</label>
          <input type="date" id="dataFim">
        </div>

        <select id="filtroNota">
          <option value="">Nota: Todas</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>

        <div class="quebra"></div>

        <select id="filtroProduto">
          <option value="">Todos os Produtos</option>
          <option value="Alarme Monitorado">Alarme Monitorado</option>
          <option value="Câmeras de Segurança">Câmeras de Segurança</option>
          <option value="Rastreador Veicular">Rastreador Veicular</option>
          <option value="Vigilância/Portaria">Vigilância / Portaria</option>
          <option value="Bombeiro/Limpeza">Bombeiro / Limpeza</option>
        </select>

        <select id="filtroFuncionario">
          <option value="">Todos os Atendentes</option>
        </select>

        <select id="filtroSetor" style="display:none;">
          <option value="">Todos os Setores</option>
          <option value="Operacional">Operacional</option>
          <option value="Monitoramento">Monitoramento</option>
          <option value="Comercial">Comercial</option>
          <option value="Administrativo">Administrativo</option>
          <option value="RH">RH</option>
          <option value="Financeiro">Financeiro</option>
          <option value="TI">TI</option>
        </select>

      </div>

      <div class="nps-box">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h2v16h16v2H3z"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></svg>
        <span id="npsBox">Calculando NPS...</span>
      </div>
      <div class="comentarios-container" id="comentariosContainer"></div>
    </div>
  </div>

  <footer>
    <p>Monitoramento 24h • Segurança Residencial e Empresarial<br>
      © 2025 Vegas Vigilância</p>
  </footer>

  <button type="button" class="tema-fab" id="btnTema" onclick="alternarTema()"></button>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbynVCaW7QoKzgkmZG5d1U4lUdYPy_0gjYLmntVx5b-UdrhRjshZ2iz-W_frksVxlq8q3Q/exec";

    let respostasOriginais = [];
    let meuGrafico = null;
    let abaSelecionada = "Respostas";
    let modoFuncionario = false;

    const funcionariosVR = [
       "Aleff", "André", "Bruna","Caio", "Cássio", "Christopher", "Débora","Deiziane","Fabiana", "Fernanda", "Gilson","Guilherme","João Vitor","Jeandra", "Jocilene","Julia","Larissa", "Laura", "Lucilene", "Luzia",
      
      "Rayane", "Roberta", "Sandra", "Thais", "Yuri"
    ];

    const funcionariosNiteroi = [
      "Daiana", "Eliana", "Karollayne", "Lais", "Leticia",
      "Maria Alice", "Maria Izabel", "Regiane", "Talita",
      "Thais", "Valesca", "Vitor"
    ];

    /* ---------- Tema claro / escuro ---------- */
    const ICO_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const ICO_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>';
    const temaClaro = () => document.documentElement.getAttribute('data-theme') === 'light';

    function atualizarBotaoTema() {
      const b = document.getElementById('btnTema');
      b.innerHTML = temaClaro() ? ICO_LUA : ICO_SOL;
      const rotulo = temaClaro() ? 'Ativar modo escuro' : 'Ativar modo claro';
      b.setAttribute('aria-label', rotulo);
      b.title = rotulo;
    }

    function alternarTema() {
      const claro = !temaClaro();
      if (claro) document.documentElement.setAttribute('data-theme', 'light');
      else document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('vegas_tema', claro ? 'claro' : 'escuro'); } catch (e) {}
      atualizarBotaoTema();
      if (meuGrafico) {
        meuGrafico.options.plugins.legend.labels.color = corTextoGrafico();
        meuGrafico.data.datasets[0].borderColor = corBordaGrafico();
        meuGrafico.update();
      }
    }

    const corTextoGrafico = () => temaClaro() ? '#0d1a30' : '#ffffff';
    const corBordaGrafico = () => temaClaro() ? '#ffffff' : '#0b111c';

    /* Protege contra textos com HTML vindos das respostas */
    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function atualizarFuncionarios() {
      const select = document.getElementById("filtroFuncionario");
      select.innerHTML = '<option value="">Todos os Atendentes</option>';
      const lista = abaSelecionada === "Respostas" ? funcionariosVR : funcionariosNiteroi;
      lista.forEach(nome => {
        const option = document.createElement("option");
        option.value = nome;
        option.textContent = nome;
        select.appendChild(option);
      });
    }

    function ajustarFiltrosVisiveis() {
      document.getElementById("filtroProduto").style.display = modoFuncionario ? "none" : "";
      document.getElementById("filtroFuncionario").style.display = modoFuncionario ? "none" : "";
      document.getElementById("filtroSetor").style.display = modoFuncionario ? "" : "none";
    }

    async function buscarDados() {
      let cidade = "vr";
      if (abaSelecionada === "Respostas Niteroi") cidade = "niteroi";
      else if (abaSelecionada === "Respostas Funcionários") cidade = "funcionarios";

      const resposta = await fetch(`${API_URL}?cidade=${cidade}`);
      const dados = await resposta.json();
      const isFunc = cidade === "funcionarios";

      return dados.reverse().map(item => {
        const rawDate = item.carimbo || item.timestamp || item.data;
        return {
          nota: Number(item.nota),
          nome: item.nome?.trim() || (isFunc ? "Anônimo" : "Sem nome"),
          telefone: item.telefone || "-",
          produtos: item.produtos || "Não informado",
          funcionario: item.funcionario || "Não informado",
          setor: item.setor || "Não informado",
          tempoCasa: item.tempoCasa || "-",
          comentarios: item.comentarios || "Sem comentário",
          isFunc,
          data: rawDate ? new Date(rawDate) : null
        };
      });
    }

    function gerarGraficoPizza(respostas) {
      const contagemNotas = new Array(11).fill(0);
      respostas.forEach(r => contagemNotas[r.nota]++);

      const ctx = document.getElementById('graficoPizza').getContext('2d');
      if (meuGrafico) meuGrafico.destroy();

      meuGrafico = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: contagemNotas.map((_, i) => `Nota ${i}`),
          datasets: [{
            data: contagemNotas,
            borderColor: corBordaGrafico(),
            borderWidth: 1,
            backgroundColor: [
              '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
              '#9966FF', '#FF9F40', '#E7E9ED', '#8BC34A',
              '#795548', '#607D8B', '#3F51B5'
            ]
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: corTextoGrafico(), font: { family: "Montserrat, Arial, sans-serif", size: 12, weight: '600' }, boxWidth: 34, padding: 10 }
            }
          }
        }
      });
    }

    function calcularNPS(respostas) {
      const total = respostas.length;
      if (total === 0) {
        document.getElementById("npsBox").textContent = modoFuncionario ? "eNPS: N/A" : "NPS: N/A";
        return;
      }

      const promotores = respostas.filter(r => r.nota >= 9).length;
      const detratores = respostas.filter(r => r.nota <= 6).length;
      const nps = Math.round(((promotores - detratores) / total) * 100);
      const rotulo = modoFuncionario ? "eNPS" : "NPS";

      document.getElementById("npsBox").textContent =
        `${rotulo}: ${nps} (Promotores: ${promotores}, Detratores: ${detratores}, Total: ${total})`;
    }

    const ICO_ESTRELA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';
    const ICO_DATA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3zm-2 7v10h14V9zm2 2h3v3H7z"/></svg>';

    function preencherComentarios(respostas) {
      const container = document.getElementById("comentariosContainer");
      container.innerHTML = "";

      respostas.forEach(r => {
        const dataFormatada = r.data ? r.data.toLocaleDateString('pt-BR') : 'Data não informada';
        const extras = r.isFunc
          ? `Setor: ${esc(r.setor)}<br>Tempo de casa: ${esc(r.tempoCasa)}`
          : `Tel: ${esc(r.telefone)}<br>Produto(s): ${esc(r.produtos)}<br>Atendente: ${esc(r.funcionario)}`;

        const card = document.createElement("div");
        card.className = "card-comentario";
        card.innerHTML = `
          <div class="nota">${ICO_ESTRELA}Nota: ${esc(r.nota)}</div>
          <div class="nome">${esc(r.nome)}</div>
          <div class="data-card">${ICO_DATA}Enviado em: ${dataFormatada}</div>
          <div class="comentario">"${esc(r.comentarios)}"</div>
          <div class="extras">${extras}</div>`;
        container.appendChild(card);
      });
    }

    function aplicarFiltros() {
      const nomeFiltro = document.getElementById("buscaNome").value.toLowerCase();
      const notaFiltro = document.getElementById("filtroNota").value;
      const produtoFiltro = document.getElementById("filtroProduto").value;
      const funcionarioFiltro = document.getElementById("filtroFuncionario").value;
      const setorFiltro = document.getElementById("filtroSetor").value;
      const dataInicio = document.getElementById("dataInicio").value;
      const dataFim = document.getElementById("dataFim").value;

      let filtradas = respostasOriginais;

      if (nomeFiltro) filtradas = filtradas.filter(r => r.nome.toLowerCase().includes(nomeFiltro));
      if (notaFiltro) filtradas = filtradas.filter(r => String(r.nota) === notaFiltro);

      if (modoFuncionario) {
        if (setorFiltro) filtradas = filtradas.filter(r => r.setor === setorFiltro);
      } else {
        if (produtoFiltro) filtradas = filtradas.filter(r => r.produtos.includes(produtoFiltro));
        if (funcionarioFiltro) filtradas = filtradas.filter(r => r.funcionario === funcionarioFiltro);
      }

      if (dataInicio) {
        const [a, m, d] = dataInicio.split("-");
        const dt = new Date(a, m - 1, d, 0, 0, 0);
        filtradas = filtradas.filter(r => r.data && r.data >= dt);
      }

      if (dataFim) {
        const [a, m, d] = dataFim.split("-");
        const dt = new Date(a, m - 1, d, 23, 59, 59);
        filtradas = filtradas.filter(r => r.data && r.data <= dt);
      }

      preencherComentarios(filtradas);
      calcularNPS(filtradas);
      gerarGraficoPizza(filtradas);
    }

    async function carregarDashboard() {
      modoFuncionario = abaSelecionada === "Respostas Funcionários";
      ajustarFiltrosVisiveis();
      if (!modoFuncionario) atualizarFuncionarios();
      respostasOriginais = await buscarDados();
      preencherComentarios(respostasOriginais);
      calcularNPS(respostasOriginais);
      gerarGraficoPizza(respostasOriginais);
    }

    document.getElementById("filtroCidade").addEventListener("change", async function () {
      abaSelecionada = this.value;
      await carregarDashboard();
    });

    document.getElementById("buscaNome").addEventListener("input", aplicarFiltros);
    document.getElementById("filtroNota").addEventListener("change", aplicarFiltros);
    document.getElementById("filtroProduto").addEventListener("change", aplicarFiltros);
    document.getElementById("filtroFuncionario").addEventListener("change", aplicarFiltros);
    document.getElementById("filtroSetor").addEventListener("change", aplicarFiltros);
    document.getElementById("dataInicio").addEventListener("change", aplicarFiltros);
    document.getElementById("dataFim").addEventListener("change", aplicarFiltros);

    atualizarBotaoTema();
    carregarDashboard();
  </script>

</body>
